# The chart by digest (D3 = C): the digest beats the tag, so a re-pushed 92.18.0 changes nothing. The tag
# is for people; P4b's test checks the chart at the digest is that version. Upgrade: both lines in one PR.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "92.18.0"
    digest: sha256:bf0af6052d5e38a59118bb14f1cb5db1705a45d18799836d699e0a21d6ff5b76
