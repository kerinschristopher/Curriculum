apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Local kind cluster only. Binds hostPorts 80/443 (reached via kind's extraPortMappings), reports
# "localhost" as the Ingress address, and uses a 0s grace period. Right for a laptop, wrong for any
# real cluster: use ../ingress-nginx there.
resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
