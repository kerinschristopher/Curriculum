apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Its own Flux entry point (monitoring-config in Acme/infra/bootstrap/platform.yaml), applied once
# infrastructure is Ready. No base or overlay lists this folder. sample-api-alerts.test.yaml is test data
# for promtool, so it isn't listed.
namespace: monitoring

resources:
  - sample-api-alerts.yaml

# sample-api's dashboard (FR4), loaded by Grafana's sidecar because of the chart's label. No hash suffix:
# nothing refers to it by name, and the sidecar picks up changes itself.
configMapGenerator:
  - name: sample-api-dashboard
    files:
      - dashboards/sample-api.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
