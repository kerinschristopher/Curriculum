# kind cluster for local Module 5 testing.
# extraPortMappings forward the host's ports 80/443 into the kind node container,
# where the ingress-nginx controller binds via hostPort.
# Install that controller with: kubectl apply -k platform/infrastructure/overlays/kind
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sample-api
nodes:
  - role: control-plane
    # Kubernetes 1.35: Flux 2.10 needs >= 1.35.2, ingress-nginx 1.15.1 stops at 1.35. Digest from the kind v0.33.0 release notes.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
