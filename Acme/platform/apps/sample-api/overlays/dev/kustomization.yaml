apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-api-dev
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/kerinschristopher/sample-api
    newTag: 0.2.0 # {"$imagepolicy": "flux-system:sample-api:tag"}
    digest: sha256:f05d8f88a20e3d172a556c758cacdd5539ba329ec27d7464e6b52e8e59eeedc9 # {"$imagepolicy": "flux-system:sample-api:digest"}
configMapGenerator:
  - name: sample-api-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - FAULT_INJECTION=enabled
patches:
  - path: replicas.yaml
  - path: ingress-host.yaml
    target:
      kind: Ingress
      name: sample-api
