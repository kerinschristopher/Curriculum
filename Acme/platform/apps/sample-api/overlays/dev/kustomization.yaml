apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-api-dev
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/kerinschristopher/sample-api
    newTag: 0.1.4 # {"$imagepolicy": "flux-system:sample-api:tag"}
    digest: sha256:e8f5683cd45391453bf59d297436e5c571ae144fe390d1935f91f6bcd3837588 # {"$imagepolicy": "flux-system:sample-api:digest"}
configMapGenerator:
  - name: sample-api-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
patches:
  - path: replicas.yaml
  - path: ingress-host.yaml
    target:
      kind: Ingress
      name: sample-api
