apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-api-prod

resources:
  - namespace.yaml
  - ../../base

images:
  - name: ghcr.io/kerinschristopher/sample-api
    newTag: 0.1.1

configMapGenerator:
  - name: sample-api-config
    behavior: merge
    literals:
      # Must match images[].newTag above until Module 6, when CI builds the version into the
      # binary and APP_VERSION (here, in base and in the Deployment) is deleted.
      # TODO(kerinschristopher): docs/curriculum.md#module-6-github-actions-and-cicd-week-7
      - APP_VERSION=0.1.1
      - LOG_LEVEL=warn

patches:
  - path: replicas.yaml
  - path: resources.yaml
  # No ingress host patch: prod inherits sample-api.example.com from base.
  # That is a non-functional placeholder (example.com is reserved by RFC 2606);
  # replace it in base/ingress.yaml with the real domain once one exists.