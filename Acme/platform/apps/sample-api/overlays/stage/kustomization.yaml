apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-api-stage

resources:
  - namespace.yaml
  - ../../base

images:
  - name: ghcr.io/kerinschristopher/sample-api
    newTag: 0.1.1

configMapGenerator:
  - name: sample-api-config
    behavior: merge
    literals:
      - APP_VERSION=0.1.1

patches:
  - path: replicas.yaml
  - path: resources.yaml
  - path: ingress-host.yaml
    target:
      kind: Ingress
      name: sample-api
