apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-api-stage

resources:
  - namespace.yaml
  - ../../base
  - pdb.yaml

images:
  - name: ghcr.io/kerinschristopher/sample-api
    newTag: 0.2.0
    digest: sha256:f05d8f88a20e3d172a556c758cacdd5539ba329ec27d7464e6b52e8e59eeedc9

patches:
  - path: replicas.yaml
  - path: resources.yaml
  - path: ingress-host.yaml
    target:
      kind: Ingress
      name: sample-api
