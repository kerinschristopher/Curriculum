apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  labels:
    app: sample-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-api
  template:
    metadata:
      labels:
        app: sample-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample-api
          image: ghcr.io/kerinschristopher/sample-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sample-api-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # On pod deletion, SIGTERM and endpoint removal start at the same time, but kube-proxy on
          # every node takes a moment to stop routing to this pod. Sleeping first keeps the server
          # accepting until routing catches up; then SIGTERM triggers the app's graceful drain
          # (main.go serve, in images built after 0.1.1; the overlays still pin 0.1.1, which exits
          # at once on SIGTERM, until the next release). Measured on kind: 36 of 7,555 requests failed during a rolling restart
          # without this. The native sleep action is needed because the scratch image has no
          # `sleep` binary (Kubernetes >= 1.30; dev EKS runs 1.36). The sleep counts against
          # terminationGracePeriodSeconds (default 30s): 5s here + up to 20s drain fits.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]