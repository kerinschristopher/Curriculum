apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Listed by name, so the Helm values file is never applied as a manifest (design doc F6).
resources:
  - flux-instance.yaml
  - flux-operator.yaml
  - platform.yaml

# The values helm install reads, as the ConfigMap the Operator's HelmRelease reads (valuesFrom): one
# source for the tag@digest. No hash suffix: the HelmRelease names it inside a ResourceSet template,
# where kustomize doesn't rewrite names.
configMapGenerator:
  - name: flux-operator-values
    namespace: flux-system
    files:
      - values.yaml=flux-operator-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
