# What Flux applies after itself (design doc §1, Defaults §7): infrastructure first (ingress-nginx, the
# monitoring stack), then monitoring-config and each environment, which all wait on it.
# prune: deleting from Git deletes from the cluster. deletionPolicy Orphan: deleting these Flux objects leaves
# the workloads running.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  # Longer than the kube-prometheus-stack HelmRelease's 10m: wait: true covers that release's install, which
  # starts after this clock does (Module 9, Carry-overs D6).
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Acme/platform/infrastructure/overlays/kind
  prune: true
  deletionPolicy: Orphan
  wait: true
---
# Module 9 D1 = C: what needs the monitoring chart's CRDs (the alert rule, our dashboard). It waits for
# infrastructure to be Ready, so a PrometheusRule is never applied before the chart has installed its CRD (F22).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-config
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Acme/platform/infrastructure/monitoring-config
  prune: true
  deletionPolicy: Orphan
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dev
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Acme/platform/apps/overlays/dev
  prune: true
  deletionPolicy: Orphan
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-stage
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Acme/platform/apps/overlays/stage
  prune: true
  deletionPolicy: Orphan
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-prod
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Acme/platform/apps/overlays/prod
  prune: true
  deletionPolicy: Orphan
