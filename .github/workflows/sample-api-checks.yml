name: sample-api-checks

# Format/vet/build the Go service and render every Kustomize tree, so a broken build or overlay
# fails here instead of at deploy time. Module 6 grows this into the full sample-api-ci.yml
# (tests, Trivy scan, GHCR push).
# No secrets and no OIDC (no id-token permission), so the pull_request trigger is safe and does
# not touch the trigger/trust/ruleset coupling described in terraform-plan.yml.
on:
  pull_request:
    paths:
      - Acme/apps/sample-api/**
      - Acme/platform/**
      - .github/workflows/sample-api-checks.yml
  push:
    branches: [main, "mod*"]
    paths:
      - Acme/apps/sample-api/**
      - Acme/platform/**
      - .github/workflows/sample-api-checks.yml

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Acme/apps/sample-api

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: Acme/apps/sample-api/go.mod
          # Stdlib only, so no go.sum and nothing to cache. Once a dependency is added, enable this with
          # cache-dependency-path: Acme/apps/sample-api/go.sum
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  kustomize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # kubectl (with built-in kustomize) is preinstalled on ubuntu-latest
      - name: Render every base and overlay
        run: |
          set -euo pipefail
          for dir in Acme/platform/apps/sample-api/base \
                     Acme/platform/apps/sample-api/overlays/* \
                     Acme/platform/infrastructure/overlays/*; do
            echo "== $dir"
            kubectl kustomize "$dir" > /dev/null
          done
