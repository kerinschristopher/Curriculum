name: terraform-checks

# fmt and validate every Terraform root on each PR and push, so no stack can merge unvalidated.
# terraform-plan.yml still runs real plans, manually and for dev only (its role is scoped to dev's state).
# No secrets and no OIDC (no id-token permission): init runs with -backend=false, so these triggers
# don't touch the trigger/trust/ruleset coupling described in terraform-plan.yml.
on:
  pull_request:
    paths:
      - Acme/infra/terraform/**
      - .github/workflows/terraform-checks.yml
  push:
    branches: [main, "mod*"]
    paths:
      - Acme/infra/terraform/**
      - .github/workflows/terraform-checks.yml

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.3"

      - name: Terraform fmt
        working-directory: Acme/infra/terraform
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every root module (a directory with its own backend and lockfile). Modules under modules/
        # are validated through the roots that call them. Add new roots here.
        root:
          - account
          - ci-iam
          - environments/dev
          - state-backend
    defaults:
      run:
        working-directory: Acme/infra/terraform/${{ matrix.root }}

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.3"

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate
