name: sample-api-ci

# What "passing" means for sample-api: formatted, vetted and linted; tests pass with the race
# detector on every supported Go release; every Kustomize tree renders; the image builds; and
# Trivy finds no fixable HIGH/CRITICAL vulnerabilities. Only a change that meets all of that,
# on main, is pushed to GHCR, and the bytes pushed are the bytes scanned.
#
# No secrets and no OIDC (no id-token permission anywhere), so the pull_request trigger is safe
# and this workflow is outside the trigger/trust/ruleset coupling described in terraform-plan.yml.
# GHCR is written with the run's short-lived GITHUB_TOKEN.
#
# Design: docs/design/module-6-ci-cd.md, Components §1.

on:
  # No workflow-level path filters: a required check that never reports would block unrelated
  # PRs forever. The `changes` job decides instead, and skipped jobs count as passing.
  pull_request:
  push:
    # mod* keeps CI feedback on module branches before a PR exists; only main publishes.
    branches: [main, "mod*"]
    # A v* tag on a commit that main already built gives that image a release tag (release-tag).
    tags: ["v*"]

# Least privilege by default: every job can only read the repo. The two jobs that write
# packages ask for it explicitly.
permissions:
  contents: read

# A new push to the same PR makes the old run pointless, so cancel it. Never cancel runs on
# main: each one may be publishing an image. Pushes get a group of their own (the run ID),
# because GitHub cancels a *pending* run when a newer one queues in the same group, even
# with cancel-in-progress off; that would drop a merge commit's sha-* image.
concurrency:
  group: sample-api-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_DIR: Acme/apps/sample-api
  # GHCR image names must be lowercase.
  IMAGE_NAME: ghcr.io/kerinschristopher/sample-api

jobs:
  changes:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - name: Check out code (full history, to diff against the base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did the app, its manifests or this workflow change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          fi
          # A new branch (before = 000...0) or a force-push leaves no usable base: run everything.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base ($base); running all jobs"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base...$head")"
          echo "$changed"
          if grep -qE '^(Acme/apps/sample-api/|Acme/platform/|\.github/workflows/sample-api-ci\.yml$)' <<<"$changed"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Acme/apps/sample-api
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (minimum version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: Acme/apps/sample-api/go.mod
          # Stdlib only, so no go.sum and nothing to cache. Once a dependency is added, enable this with
          # cache-dependency-path: Acme/apps/sample-api/go.sum
          cache: false

      # gofmt -l exits 0 even when it finds problems, so turn "any output" into a failure.
      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: Acme/apps/sample-api

  # Matrix: the same job once per supported Go release, in parallel, as test (1.26) and test (1.27).
  # It catches breakage before a Go upgrade. Keep it in step with go.mod (oldest) and the
  # Dockerfile (current).
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Acme/apps/sample-api
    env:
      # Use exactly the Go that setup-go installed; never auto-download a newer toolchain.
      GOTOOLCHAIN: local
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      # -count=1 bypasses Go's test cache so the tests really run.
      # -race catches unsynchronized access between goroutines (HTTP handlers run concurrently).
      - name: Test
        run: go test -race -count=1 -v ./...

  # The required check for tests. The matrix legs' names include the Go version, so requiring
  # them directly would strand the merge gate the first time the matrix is bumped.
  test-result:
    needs: [changes, test]
    if: always() && github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every test leg passed (or the change didn't touch the app)
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES test=$TEST"
          [ "$CHANGES" = success ] && { [ "$TEST" = success ] || [ "$TEST" = skipped ]; }

  kustomize:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kubectl (with built-in kustomize) is preinstalled on the runner image.
      - name: Render every base and overlay
        run: |
          set -euo pipefail
          for dir in Acme/platform/apps/sample-api/base \
                     Acme/platform/apps/sample-api/overlays/* \
                     Acme/platform/infrastructure/overlays/*; do
            echo "== $dir"
            kubectl kustomize "$dir" > /dev/null
          done

  build-scan:
    needs: [changes, lint, test-result, kustomize]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This job runs a third-party scanner, so it gets NO secrets and NO write permissions.
    # Even a compromised scanner (trivy-action, March 2026) would find nothing worth stealing.
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image tag
        id: tag
        run: echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once and save the image as a tarball. The push job pushes this exact file,
      # so what gets published is byte-for-byte what was scanned.
      # No layer cache on purpose: Module 7 measures cold vs warm builds and needs this baseline.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          push: false
          build-args: VERSION=${{ steps.tag.outputs.version }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/sample-api.tar
          provenance: false

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/sample-api.tar
          version: v0.75.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # The action caches its vulnerability DB by default. Off until Module 7 adds caching
          # deliberately, so docs/ci.md never describes a cache nobody chose.
          cache: false

      - name: Upload scanned image for the push job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-api-image
          path: ${{ runner.temp }}/sample-api.tar
          retention-days: 1
          if-no-files-found: error

  push:
    needs: build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job besides release-tag allowed to write packages. It never checks out code and
    # runs no third-party tools other than the official Docker login action.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sample-api-image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${{ runner.temp }}/sample-api.tar"

      # GITHUB_TOKEN is created for this run and expires when it ends: no stored credential.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<short> only. No `latest`: a moving label lets cached nodes run different builds
      # under one name and makes "roll back to the previous version" meaningless.
      - name: Push
        run: docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::7}"

  # Build once, retag to release: a v* git tag adds a semver label to the image main already
  # built, scanned and tested. Nothing is rebuilt, so the release is byte-for-byte the tested
  # image (the binary still reports sha-<short> as its version; the release shows in the tag).
  release-tag:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the release tag to the already-scanned image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver="${TAG#v}"
          if ! [[ "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>"
            exit 1
          fi
          src="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          if ! docker buildx imagetools inspect "$src" > /dev/null 2>&1; then
            echo "::error::$src doesn't exist. Tag a commit that's on main with a green sample-api-ci run."
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE_NAME}:${semver}" "$src"

          # Prove the release label points at the same image, not a copy.
          a="$(docker buildx imagetools inspect "$src" --format '{{json .Manifest.Digest}}')"
          b="$(docker buildx imagetools inspect "${IMAGE_NAME}:${semver}" --format '{{json .Manifest.Digest}}')"
          echo "sha tag: $a  release tag: $b"
          [ "$a" = "$b" ]
