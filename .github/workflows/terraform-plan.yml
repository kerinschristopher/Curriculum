name: terraform-plan

# The role's trust policy accepts tokens from a push (or manual run) on `main` and `mod*` branches only
# (github_branches in environments/dev/main.tf). Other branches fail at the assume-role step.
# A pull_request trigger would produce a different `sub` claim and be rejected.
on:
  push:
    paths:
      - "Acme/infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

# id-token: write is required, or GitHub will not issue an OIDC token at all.
permissions:
  contents: read
  id-token: write

# One run at a time so two plans don't fight over the state lock.
# Never cancel mid-run: a killed plan can leave a stale lock behind.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_DIR: Acme/infra/terraform/environments/dev
  AWS_REGION: us-east-1

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Assume the plan-only role via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::401352756330:role/dev-github-actions-plan
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-plan

      # Proves the OIDC exchange worked: should show assumed-role/dev-github-actions-plan
      - name: Show AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.3"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform fmt
        working-directory: Acme/infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -lock-timeout=60s -no-color
