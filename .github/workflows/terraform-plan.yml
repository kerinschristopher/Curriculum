name: terraform-plan

# What "passing" means for Terraform: every root is formatted and valid, and the dev plan runs
# cleanly as the read-only plan role. On a PR the dev plan is posted as one comment (updated on
# every push), so the reviewer sees what a merge would change before it's merged.
#
# Trigger/trust/ruleset coupling: plan-dev assumes dev-github-actions-plan, whose trust policy
# (Acme/infra/terraform/ci-iam/main.tf) accepts the OIDC sub of:
#   - pull_request runs ("repo:<repo>:pull_request", from any same-repo branch; forks get no token)
#   - workflow_dispatch runs on main or mod* ("repo:<repo>:ref:refs/heads/<branch>")
# Who can create or push main and mod* is set by the trusted-branches ruleset (Acme/infra/github/).
# The triggers, the trust list and the ruleset move together: change one, check the other two.
#
# Design: docs/design/module-6-ci-cd.md, Components §2.

on:
  # No workflow-level path filters: a required check that never reports would block unrelated
  # PRs forever. The `changes` job decides instead, and skipped jobs count as passing.
  pull_request:
  push:
    # fmt/validate feedback on module branches before a PR exists (no plan, no credentials).
    branches: [main, "mod*"]
  # Manual plan of dev from main or mod*: gh workflow run terraform-plan.yml --ref <branch>
  workflow_dispatch:

# Least privilege by default. Only plan-dev asks for an OIDC token and PR write access.
permissions:
  contents: read

# A newer push to the same PR supersedes the old plan, so cancel it. Safe because these plans
# run with -lock=false: a cancelled plan can't leave a stale lock.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_ROOT: Acme/infra/terraform
  # Keep equal to TF_VERSION in terraform-plan-reusable.yml and terraform-apply.yml.
  TF_VERSION: "1.16.3"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.diff.outputs.terraform }}
      dev: ${{ steps.diff.outputs.dev }}
    steps:
      - name: Check out code (full history, to diff against the base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did any Terraform, the dev root or this workflow change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run; running all jobs"
            { echo "terraform=true"; echo "dev=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          fi
          # A new branch (before = 000...0) or a force-push leaves no usable base: run everything.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base ($base); running all jobs"
            { echo "terraform=true"; echo "dev=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base...$head")"
          echo "$changed"
          workflow='^\.github/workflows/terraform-plan(-reusable)?\.yml$'
          if grep -qE "^Acme/infra/terraform/|$workflow" <<<"$changed"; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi
          # The dev plan depends on the dev root and the modules it calls.
          if grep -qE "^Acme/infra/terraform/(environments/dev|modules)/|$workflow" <<<"$changed"; then
            echo "dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive -diff

  validate:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every root module (a directory with its own backend and lockfile). Modules under modules/
        # are validated through the roots that call them. Add new roots here.
        root:
          - account
          - ci-iam
          - environments/dev
          - state-backend
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}/${{ matrix.root }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  # The required check (main-merge-gate), not the matrix legs: their names include the root, so
  # adding a root (stage, prod) would leave the ruleset waiting for checks that no longer exist.
  validate-result:
    needs: [changes, validate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every validate leg passed (or the change didn't touch Terraform)
        env:
          CHANGES: ${{ needs.changes.result }}
          VALIDATE: ${{ needs.validate.result }}
        run: |
          echo "changes=$CHANGES validate=$VALIDATE"
          [ "$CHANGES" = success ] && { [ "$VALIDATE" = success ] || [ "$VALIDATE" = skipped ]; }

  plan-dev:
    needs: [changes, fmt, validate-result]
    # Fork PRs get no OIDC token, so the assume step could only fail; skip them. The post-merge
    # plan in terraform-apply.yml still shows the reviewer the plan before anything is applied.
    if: >-
      needs.changes.outputs.dev == 'true'
      && github.event_name != 'push'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write # lets GitHub issue the OIDC token AWS trusts
    # The plan itself (OIDC, init, plan -lock=false, run summary, text plan artifact) is shared
    # with terraform-apply.yml. `env` isn't available in a `with:` for a called workflow, hence
    # the literals.
    uses: ./.github/workflows/terraform-plan-reusable.yml
    with:
      working-directory: Acme/infra/terraform/environments/dev
      role-arn: arn:aws:iam::401352756330:role/dev-github-actions-plan
      artifact-name: plan-dev

  # Separate from the plan so that only this job can write to the PR, and it never has AWS access.
  comment:
    needs: plan-dev
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # lets the job post the plan comment
    steps:
      - name: Download the text plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-dev-text
          path: ${{ runner.temp }}

      # Reads the plan from a file and uses no ${{ }} expressions in the script, so nothing a PR
      # controls (branch name, title, plan text) can be injected into the JavaScript.
      - name: Comment the plan on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:dev -->';
            let plan = fs.readFileSync(`${process.env.RUNNER_TEMP}/plan.txt`, 'utf8');

            // An outputs-only plan has no "Plan:" line.
            const summary =
              (plan.match(/^(Plan: .*|No changes\..*)$/m) || [])[0]
              || (/^Changes to Outputs:/m.test(plan) ? 'No resource changes; only output values change.' : '(no summary line found)');

            const limit = 60000; // GitHub comments max out at 65,536 characters
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n... truncated; see the workflow run summary for the full plan.';
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### Terraform plan: `environments/dev`',
              '',
              `**${summary}**`,
              '',
              `Commit \`${sha}\` · [workflow run](${runUrl})`,
              '',
              '<details><summary>Full plan</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            // Update our earlier comment instead of adding a new one on every push.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
